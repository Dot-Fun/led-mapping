[package]
name = "ledmap-rt"
version = "0.1.0"
edition = "2021"
description = "Zero-jitter Rust 3D DDP player & Rayon parallel ternary decoder accelerator"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
