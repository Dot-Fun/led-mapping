[project]
name = "ledmap"
version = "0.1.0"
description = "Multi-camera, multi-controller 3D WLED mapping and spatial effect studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "opencv-python-headless>=4.10.0",
    "zeroconf>=0.135.0",
    "pydantic>=2.9.0",
    "pillow>=10.4.0",
    "qrcode>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
